<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Aletheia — provenance-enforcing MAS for drug design</title>
<style>
  :root { --bg:#0f1115; --panel:#161922; --line:#272b38; --txt:#e6e8ee; --dim:#9aa3b2;
          --computed:#4ea3ff; --predicted:#e0a33a; --retrieved:#44b77b; --hypothesis:#b07ae0;
          --bad:#e05a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.55 "Segoe UI",system-ui,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:14px; }
  header h1 { font-size:17px; margin:0; letter-spacing:.2px; }
  header span { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 1fr 380px; gap:0; height:calc(100vh - 53px); }
  #left { overflow:auto; padding:18px 22px; }
  #right { border-left:1px solid var(--line); overflow:auto; padding:14px 16px;
           background:var(--panel); }
  form { display:flex; gap:8px; margin-bottom:14px; }
  input[type=text] { flex:1; background:var(--panel); border:1px solid var(--line);
                     color:var(--txt); padding:10px 12px; border-radius:6px; font-size:14px; }
  button { background:#2b4b7d; color:#fff; border:0; padding:10px 16px; border-radius:6px;
           cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:default; }
  select { background:var(--panel); color:var(--txt); border:1px solid var(--line);
           border-radius:6px; padding:0 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--dim);
          padding:4px 9px; border-radius:12px; font-size:12px; cursor:pointer; }
  .chip:hover { color:var(--txt); border-color:#3a4055; }
  pre, code { font-family:"Cascadia Mono",Consolas,monospace; font-size:12.5px; }
  #answer { white-space:pre-wrap; }
  #answer h1 { font-size:18px; } #answer h2 { font-size:15px; margin-top:20px;
    border-bottom:1px solid var(--line); padding-bottom:4px; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th,td { border:1px solid var(--line); padding:4px 6px; text-align:left; }
  .tag { font-size:10.5px; padding:1px 5px; border-radius:3px; font-weight:600; }
  .COMPUTED { background:rgba(78,163,255,.16); color:var(--computed); }
  .PREDICTED { background:rgba(224,163,58,.16); color:var(--predicted); }
  .RETRIEVED { background:rgba(68,183,123,.16); color:var(--retrieved); }
  .HYPOTHESIS { background:rgba(176,122,224,.16); color:var(--hypothesis); }
  .trace { font-size:11.5px; color:var(--dim); }
  .trace div { padding:1px 0; }
  .ok { color:var(--retrieved); } .warn { color:var(--predicted); } .err { color:var(--bad); }
  .meta { color:var(--dim); font-size:12px; margin-bottom:10px; }
  h3 { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
       margin:18px 0 6px; }
  .blocked { border-left:3px solid var(--bad); padding-left:10px; }
</style>
</head>
<body>
<header>
  <h1>Aletheia</h1>
  <span>provenance-enforcing multi-agent system for drug discovery &amp; design — every number resolves to a tool run, or the answer is withheld</span>
</header>
<main>
  <div id="left">
    <form id="f">
      <input type="text" id="q" placeholder="e.g. Dock erlotinib into EGFR structure 1M17 and validate it by redocking" autocomplete="off"/>
      <select id="pattern"><option value="supervisor">supervisor</option><option value="blackboard">blackboard</option></select>
      <button id="go" type="submit">Ask</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="meta" id="meta"></div>
    <div id="answer"></div>
  </div>
  <div id="right">
    <h3>Agent trace</h3>
    <div class="trace" id="trace"></div>
    <h3>Claims ledger</h3>
    <div id="ledger"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
fetch('/api/scenarios').then(r=>r.json()).then(d=>{
  $('#chips').innerHTML = d.scenarios.map(s=>
    `<span class="chip" data-q="${s.query.replace(/"/g,'&quot;')}">${s.id} · ${s.title}</span>`).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ $('#q').value=c.dataset.q; });
});
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function md(t){
  return esc(t)
    .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>')
    .replace(/^# (.*)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\b(COMPUTED|PREDICTED|RETRIEVED|HYPOTHESIS)\b/g,'<span class="tag $1">$1</span>');
}
$('#f').onsubmit = async ev => {
  ev.preventDefault();
  const q = $('#q').value.trim(); if(!q) return;
  $('#go').disabled = true; $('#answer').innerHTML=''; $('#trace').innerHTML='running…';
  $('#ledger').innerHTML=''; $('#meta').textContent='working…';
  try {
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
                                       body: JSON.stringify({query:q, pattern:$('#pattern').value})});
    const d = await r.json();
    $('#meta').innerHTML = `run <code>${d.run_id}</code> · source <code>${d.source}</code> · `
      + `${d.duration_s}s · ${d.cost.tool_calls} tool calls (${d.cost.cached_tool_calls} cached) · `
      + `${d.cost.llm_calls} LLM calls via <code>${d.cost.llm_backend}</code> · `
      + (d.verification ? `ledger ${(d.verification.numeric_coverage*100).toFixed(0)}% ` +
         `(${d.verification.n_resolved_tokens}/${d.verification.n_numeric_tokens})` : '');
    $('#answer').innerHTML = `<div class="${d.blocked?'blocked':''}">${md(d.markdown)}</div>`;
    $('#trace').innerHTML = d.trace.map(e=>{
      const cls = e.kind==='degraded'?'warn':(e.ok===false?'err':(e.kind==='verification'?'ok':''));
      return `<div class="${cls}">${(e.t??0).toFixed(2)}s · ${e.kind}`
        + (e.agent?` · <b>${e.agent}</b>`:'') + (e.tool?` · ${e.tool}`:'')
        + (e.cached?' · cached':'') + (e.detail?` · ${esc(String(e.detail)).slice(0,90)}`:'')
        + `</div>`;
    }).join('');
    $('#ledger').innerHTML = '<table><tr><th>id</th><th>tag</th><th>key</th><th>value</th>'
      + '<th>provenance</th></tr>' + d.ledger.map(r=>
      `<tr><td>${r.claim_id}</td><td><span class="tag ${r.tag}">${r.tag}</span></td>`
      + `<td>${esc(r.key)}</td><td>${esc(String(r.value)).slice(0,22)}</td>`
      + `<td>${esc(r.source_id || (r.tool||'') + ' ' + (r.tool_version||''))}</td></tr>`).join('')
      + '</table>';
  } catch(e) { $('#meta').textContent = 'error: ' + e; }
  $('#go').disabled = false;
};
</script>
</body>
</html>
