[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-mas"
version = "0.9.0"
description = "Provenance-enforcing LLM multi-agent system for drug discovery and design"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.5",
    # RDKit is not optional: descriptors, scaffolds, fingerprints, SELFIES round-trips and every
    # generator depend on it, and `pip install -e .` fails on a clean machine without it.
    "rdkit>=2023.9",
    "requests>=2.31",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "selfies>=2.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]   # httpx: in-process UI route tests

[project.scripts]
aletheia = "aletheia.cli:main"

[tool.setuptools.packages.find]
include = ["aletheia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
